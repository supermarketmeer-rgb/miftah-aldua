<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Islamic Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Islamic 8-pointed star in the center back -->
  <g transform="translate(256 256) scale(0.92) translate(-256 -256)" opacity="0.15">
    <rect x="136" y="136" width="240" height="240" rx="20" fill="url(#goldGrad)"/>
    <rect x="136" y="136" width="240" height="240" rx="20" fill="url(#goldGrad)" transform="rotate(45 256 256)"/>
  </g>

  <!-- Open Book of Duas -->
  <g filter="url(#glow)">
    <!-- Book Spine & Pages -->
    <path d="M256 370 C220 340, 160 338, 110 354 L110 200 C160 184, 220 186, 256 216 C292 186, 352 184, 402 200 L402 354 C352 338, 292 340, 256 370 Z" 
          fill="#fefce8" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Spine Center Line -->
    <path d="M256 216 L256 370" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Page Lines -->
    <path d="M140 236 C170 226, 210 228, 236 244" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M140 264 C170 254, 210 256, 236 272" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M140 292 C170 282, 210 284, 236 300" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M150 320 C180 310, 210 312, 236 328" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Page Lines -->
    <path d="M372 236 C342 226, 302 228, 276 244" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M372 264 C342 254, 302 256, 276 272" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M372 292 C342 282, 302 284, 276 300" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M362 320 C332 310, 302 312, 276 328" stroke="#047857" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Crescent Moon & Star atop the Book -->
    <path d="M256 120 A 30 30 0 1 0 274 168 A 24 24 0 1 1 256 120" fill="url(#goldGrad)"/>
    <polygon points="274,136 277,143 285,143 279,148 281,155 274,151 268,155 270,148 264,143 271,143" fill="#fef08a"/>
  </g>
</svg>
